upstream hfta_backend {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The SPA bundle is content-hashed, the entry point is not.
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # WebSocket. This block carries every live match, so its settings are not
    # boilerplate.
    #
    # The 90s default read timeout would sever an idle socket mid-match. The
    # client heartbeats every 4s and the server pings every 15s, so a socket
    # quiet for a full hour is genuinely dead — but a player reading the
    # leaderboard between matches is not, and the default disconnects them.
    #
    # proxy_buffering off is load-bearing: frames go out at 10 Hz and nginx
    # buffering them adds latency to the one path where latency is the product.
    # -----------------------------------------------------------------------
    location /ws {
        proxy_pass http://hfta_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://hfta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://hfta_backend;
        access_log off;
    }

    # Hashed assets are immutable by construction — a changed file gets a
    # changed name, so a year-long cache can never serve a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached. It is the file that names the current
    # asset hashes; a cached copy pins the browser to a deleted bundle and the
    # app fails to boot with no obvious cause.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
